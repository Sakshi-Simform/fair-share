<!doctype html>

<html lang="en-IN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fair Share</title>

        <link
            rel="shortcut icon"
            href="assets/icons/fair_share.png"
            type="image/x-icon"
        />

        <meta
            name="description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Fair Share" />
        <meta
            property="og:description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />
        <meta property="og:image" content="assets/images/cover_image.png" />
        <meta
            property="og:image:alt"
            content="Fair Share : Expense Tracker & Splitter"
        />

        <!-- Twitter Card meta tags -->
        <meta name="twitter:title" content="Fair Share" />
        <meta
            name="twitter:description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />
        <meta name="twitter:url" content="/" />
        <meta
            name="twitter:image:src"
            content="assets/images/cover_image.png"
        />
        <meta
            name="twitter:image:alt"
            content="Fair Share : Expense Tracker & Splitter"
        />

        <link rel="stylesheet" href="styles/index.css" />
        <link rel="stylesheet" href="styles/header.css" />
        <link rel="stylesheet" href="styles/main.css" />
        <link rel="stylesheet" href="styles/form.css" />

        <script src="scripts/index.ts" type="module"></script>
    </head>
    <body class="dark-mode">
        <header class="header"></header>

        <main class="main-container"></main>

        <div id="form-container" class="form-container" popover="auto">
            <p class="form-heading">Add New Expense</p>

            <form>
                <div class="form-item">
                    <label for="title">Title</label>
                    <input
                        id="title"
                        name="title"
                        type="text"
                        placeholder="Enter Title"
                        required
                    />
                </div>

                <div class="form-item">
                    <label for="description">Description</label>
                    <input
                        id="description"
                        name="description"
                        type="text"
                        placeholder="Enter Description"
                        required
                    />
                </div>

                <div class="form-item">
                    <label for="amount">Amount</label>
                    <input
                        id="amount"
                        name="amount"
                        type="number"
                        placeholder="Enter Amount"
                        required
                    />
                </div>

                <div class="form-item">
                    <label for="participant">Participant</label>
                    <div class="participants-input-container">
                        <input
                            id="participant"
                            name="participant"
                            type="text"
                            placeholder="Enter participant"
                            required
                        />
                        <button type="button">Add</button>
                    </div>

                    <div class="participants">
                        <span>Kaushal</span>
                        <span>Sakshi</span>
                        <span>Krushna</span>
                        <span>Dhruv</span>
                    </div>
                </div>

                <div class="form-item">
                    <label for="paid-by">Paid By</label>
                    <select name="paid-by" id="paid-by">
                        <option value="user1">Kaushal</option>
                        <option value="user2">Sakshi</option>
                        <option value="user3">Krushna</option>
                        <option value="user4">Dhruv</option>
                    </select>
                </div>

                <button class="add-expense-btn">Add Expense</button>
            </form>
        </div>
    </body>
</html>
