<!doctype html>

<html lang="en-IN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fair Share</title>

        <link
            rel="shortcut icon"
            href="assets/icons/fair_share.png"
            type="image/x-icon"
        />

        <meta
            name="description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Fair Share" />
        <meta
            property="og:description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />
        <meta property="og:image" content="assets/images/cover_image.png" />
        <meta
            property="og:image:alt"
            content="Fair Share : Expense Tracker & Splitter"
        />

        <!-- Twitter Card meta tags -->
        <meta name="twitter:title" content="Fair Share" />
        <meta
            name="twitter:description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />
        <meta name="twitter:url" content="/" />
        <meta
            name="twitter:image:src"
            content="assets/images/cover_image.png"
        />
        <meta
            name="twitter:image:alt"
            content="Fair Share : Expense Tracker & Splitter"
        />

        <link rel="stylesheet" href="styles/index.css" />
        <link rel="stylesheet" href="styles/header.css" />
        <link rel="stylesheet" href="styles/main.css" />
        <link rel="stylesheet" href="styles/form.css" />

        <script src="scripts/index.ts" type="module"></script>
    </head>
    <body class="dark-mode">
        <header class="header">
            <h1 class="">FairShare</h1>
            <div class="btn-controller">
                <button id="toggle-btn">Light Mode</button>
                <button id="expense-btn">Add Expense</button>
            </div>
        </header>

        <main class="main-container"></main>

        <div class="form-container"></div>
    </body>
</html>
